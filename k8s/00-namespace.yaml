apiVersion: v1
kind: Namespace
metadata:
  name: idaas
  labels:
    name: idaas
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: idaas-quota
  namespace: idaas
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: idaas-limits
  namespace: idaas
spec:
  limits:
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 250m
      memory: 256Mi
    type: Container
