apiVersion: v1
kind: ServiceAccount
metadata:
  name: idaas-sa
  namespace: idaas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idaas-role
  namespace: idaas
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idaas-rolebinding
  namespace: idaas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idaas-role
subjects:
- kind: ServiceAccount
  name: idaas-sa
  namespace: idaas
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: idaas-network-policy
  namespace: idaas
spec:
  podSelector:
    matchLabels:
      tier: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: gateway
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          tier: backend
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 5433
