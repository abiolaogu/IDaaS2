apiVersion: v1
kind: Secret
metadata:
  name: idaas-secrets
  namespace: idaas
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual secrets before deploying
  # Use kubectl create secret or integrate with external secret managers
  # (Vault, AWS Secrets Manager, Azure Key Vault, GCP Secret Manager)

  # YugabyteDB DBaaS
  yugabyte-db-url: "jdbc:postgresql://your-yugabyte-endpoint:5433/keycloak?ssl=true&sslmode=require"
  yugabyte-user: "keycloak_prod"
  yugabyte-password: "CHANGEME_STRONG_PASSWORD"

  # DragonflyDB DBaaS
  dragonfly-url: "redis://:CHANGEME_PASSWORD@your-dragonfly-endpoint:6379/0?ssl=true"
  dragonfly-session-url: "redis://:CHANGEME_PASSWORD@your-dragonfly-endpoint:6379/1?ssl=true"

  # Keycloak
  keycloak-admin: "admin"
  keycloak-admin-password: "CHANGEME_ADMIN_PASSWORD"

  # WebApp
  secret-key: "CHANGEME_GENERATE_WITH_PYTHON_SECRETS"

  # OAuth2 Proxy
  oauth2-client-id: "webapp-client"
  oauth2-client-secret: "CHANGEME_CLIENT_SECRET"
  oauth2-cookie-secret: "CHANGEME_32_BYTE_COOKIE_SECRET"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: idaas-config
  namespace: idaas
data:
  # Keycloak
  KEYCLOAK_HOSTNAME: "auth.example.com"
  KC_DB: "postgres"
  KC_HTTP_ENABLED: "true"
  KC_HOSTNAME_STRICT: "false"
  KC_HOSTNAME_STRICT_HTTPS: "false"
  KC_PROXY: "edge"
  KC_LOG_LEVEL: "INFO"

  # WebApp
  FLASK_ENV: "production"
  LOG_LEVEL: "INFO"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8080"
  APP_VERSION: "1.0.0"

  # OAuth2 Proxy
  OAUTH2_PROXY_PROVIDER: "keycloak-oidc"
  OAUTH2_PROXY_OIDC_ISSUER_URL: "http://keycloak-service:8080/realms/master"
  OAUTH2_PROXY_REDIRECT_URL: "https://app.example.com/oauth2/callback"
  OAUTH2_PROXY_UPSTREAMS: "http://webapp-service:8080"
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"
  OAUTH2_PROXY_COOKIE_SECURE: "true"
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
  OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
  OAUTH2_PROXY_SESSION_STORE_TYPE: "redis"
