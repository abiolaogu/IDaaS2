apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: idaas
  labels:
    app: keycloak
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: idaas-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: keycloak
        image: ${CONTAINER_REGISTRY}/idaas-keycloak:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 8443
          protocol: TCP
        env:
        - name: KC_DB
          valueFrom:
            configMapKeyRef:
              name: idaas-config
              key: KC_DB
        - name: KC_DB_URL
          valueFrom:
            secretKeyRef:
              name: idaas-secrets
              key: yugabyte-db-url
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: idaas-secrets
              key: yugabyte-user
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: idaas-secrets
              key: yugabyte-password
        - name: KC_HOSTNAME
          valueFrom:
            configMapKeyRef:
              name: idaas-config
              key: KEYCLOAK_HOSTNAME
        - name: KC_HTTP_ENABLED
          valueFrom:
            configMapKeyRef:
              name: idaas-config
              key: KC_HTTP_ENABLED
        - name: KC_HOSTNAME_STRICT
          valueFrom:
            configMapKeyRef:
              name: idaas-config
              key: KC_HOSTNAME_STRICT
        - name: KC_HOSTNAME_STRICT_HTTPS
          valueFrom:
            configMapKeyRef:
              name: idaas-config
              key: KC_HOSTNAME_STRICT_HTTPS
        - name: KC_PROXY
          valueFrom:
            configMapKeyRef:
              name: idaas-config
              key: KC_PROXY
        - name: KC_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: idaas-config
              key: KC_LOG_LEVEL
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: idaas-secrets
              key: keycloak-admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: idaas-secrets
              key: keycloak-admin-password
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: idaas
  labels:
    app: keycloak
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 8443
    targetPort: 8443
    protocol: TCP
  selector:
    app: keycloak
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak-pdb
  namespace: idaas
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keycloak
