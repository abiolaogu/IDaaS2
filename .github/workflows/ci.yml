name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  test-webapp:
    name: Test Flask Web Application
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      working-directory: apps/webapp
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      working-directory: apps/webapp
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        files: apps/webapp/coverage.xml
        flags: webapp
        name: webapp-coverage
      continue-on-error: true

    - name: Archive coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: apps/webapp/htmlcov/

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install security tools
      working-directory: apps/webapp
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety flake8

    - name: Run Bandit security scan
      working-directory: apps/webapp
      run: |
        bandit -r . -f json -o bandit-report.json --exclude ./venv,./tests || true
        bandit -r . -f txt --exclude ./venv,./tests

    - name: Run Flake8 linting
      working-directory: apps/webapp
      run: |
        flake8 app.py config.py extensions.py routes.py --max-line-length=120 --count --statistics

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          apps/webapp/bandit-report.json

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-webapp, security-scan]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build webapp image
      uses: docker/build-push-action@v5
      with:
        context: apps/webapp
        file: apps/webapp/Dockerfile
        push: false
        tags: idaas-webapp:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build Keycloak image
      uses: docker/build-push-action@v5
      with:
        context: apps/keycloak
        file: apps/keycloak/Dockerfile
        push: false
        tags: idaas-keycloak:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build OAuth2 Proxy image
      uses: docker/build-push-action@v5
      with:
        context: apps/oauth2-proxy
        file: apps/oauth2-proxy/Dockerfile
        push: false
        tags: idaas-oauth2-proxy:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Start services with docker-compose
      run: |
        # Use CI-specific compose file with local databases
        docker-compose -f docker-compose.yml -f docker-compose.ci.yml up -d
        sleep 30  # Wait for services to start

    - name: Wait for services to be healthy
      run: |
        timeout 120 bash -c 'until curl -f http://localhost:8081/health; do sleep 2; done'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests

    - name: Run E2E tests
      env:
        E2E_BASE_URL: http://localhost:8081
      run: |
        pytest tests/e2e_test.py -v

    - name: Show logs on failure
      if: failure()
      run: |
        docker-compose -f docker-compose.yml -f docker-compose.ci.yml logs

    - name: Stop services
      if: always()
      run: |
        docker-compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test-webapp, security-scan, docker-build, e2e-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: All checks passed
      run: |
        echo "✅ All quality checks passed!"
        echo "- Unit tests: PASSED"
        echo "- Security scans: PASSED"
        echo "- Docker builds: PASSED"
        echo "- E2E tests: PASSED"
