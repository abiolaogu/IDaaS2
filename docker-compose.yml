version: '3.8'

services:
  # PostgreSQL Database for Keycloak
  postgres:
    image: postgres:15-alpine
    container_name: idaas-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - idaas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak Identity Provider
  keycloak:
    build:
      context: ./apps/keycloak
      dockerfile: Dockerfile
    container_name: idaas-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - idaas-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Flask Web Application
  webapp:
    build:
      context: ./apps/webapp
      dockerfile: Dockerfile
      args:
        APP_VERSION: 1.0.0
        BUILD_DATE: ${BUILD_DATE:-2024-01-01}
        VCS_REF: ${VCS_REF:-dev}
    container_name: idaas-webapp
    environment:
      FLASK_APP: app:create_app()
      FLASK_ENV: development
      LOG_LEVEL: DEBUG
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
    ports:
      - "8081:8080"
    networks:
      - idaas-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./apps/webapp:/app
    command: ["python", "app.py"]

  # OAuth2 Proxy
  oauth2-proxy:
    build:
      context: ./apps/oauth2-proxy
      dockerfile: Dockerfile
    container_name: idaas-oauth2-proxy
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: webapp-client
      OAUTH2_PROXY_CLIENT_SECRET: changeme
      OAUTH2_PROXY_COOKIE_SECRET: changeme-32-character-secret!!
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak:8080/realms/master
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://webapp:8080
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
    ports:
      - "4180:4180"
    depends_on:
      - keycloak
      - webapp
    networks:
      - idaas-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4180/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  idaas-network:
    driver: bridge
