version: '3.8'

services:
  # Keycloak Identity Provider
  # Note: Uses external DBaaS for YugabyteDB (PostgreSQL-compatible)
  keycloak:
    build:
      context: ./apps/keycloak
      dockerfile: Dockerfile
    container_name: idaas-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: ${YUGABYTE_DB_URL}
      KC_DB_USERNAME: ${YUGABYTE_USER}
      KC_DB_PASSWORD: ${YUGABYTE_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - idaas-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Flask Web Application
  # Note: Uses external DBaaS for DragonflyDB (Redis-compatible)
  webapp:
    build:
      context: ./apps/webapp
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        BUILD_DATE: ${BUILD_DATE:-2024-01-01}
        VCS_REF: ${VCS_REF:-dev}
    container_name: idaas-webapp
    environment:
      FLASK_APP: app:create_app()
      FLASK_ENV: ${FLASK_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      REDIS_URL: ${DRAGONFLY_URL}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    ports:
      - "8081:8080"
    networks:
      - idaas-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./apps/webapp:/app
    command: ["python", "app.py"]
    restart: unless-stopped

  # OAuth2 Proxy
  # Note: Uses external DBaaS for DragonflyDB (session storage)
  oauth2-proxy:
    build:
      context: ./apps/oauth2-proxy
      dockerfile: Dockerfile
    container_name: idaas-oauth2-proxy
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_CLIENT_ID:-webapp-client}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_OIDC_ISSUER_URL:-http://keycloak:8080/realms/master}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_REDIRECT_URL:-http://localhost:4180/oauth2/callback}
      OAUTH2_PROXY_UPSTREAMS: http://webapp:8080
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Session storage in external DragonflyDB (Redis-compatible)
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: ${DRAGONFLY_SESSION_URL}
    ports:
      - "4180:4180"
    depends_on:
      - keycloak
      - webapp
    networks:
      - idaas-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4180/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  idaas-network:
    driver: bridge
