version: '3.8'

# Production-specific configuration
# Override base docker-compose.yml for production deployments
# NOTE: Uses external DBaaS for YugabyteDB and DragonflyDB

services:
  keycloak:
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: ${YUGABYTE_DB_URL}
      KC_DB_USERNAME: ${YUGABYTE_USER}
      KC_DB_PASSWORD: ${YUGABYTE_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}  # MUST be set (e.g., auth.example.com)
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_PROXY: edge
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}  # MUST be set
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  webapp:
    restart: always
    environment:
      FLASK_APP: app:create_app()
      FLASK_ENV: production
      LOG_LEVEL: INFO
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      REDIS_URL: ${DRAGONFLY_URL}
      SECRET_KEY: ${SECRET_KEY}  # MUST be set
    volumes: []  # Remove development volume mount
    command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "4", "--threads", "2", "--access-logfile", "-", "--error-logfile", "-", "app:create_app()"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      replicas: 1  # Can scale horizontally with load balancer

  oauth2-proxy:
    restart: always
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_OIDC_ISSUER_URL}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_REDIRECT_URL}
      OAUTH2_PROXY_UPSTREAMS: http://webapp:8080
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_EMAIL_DOMAINS:-*}
      OAUTH2_PROXY_COOKIE_SECURE: "true"  # Enable in production with HTTPS
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Session storage in external DragonflyDB DBaaS
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: ${DRAGONFLY_SESSION_URL}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

# Note: No volumes needed for databases as they are managed by DBaaS
networks:
  idaas-network:
    driver: bridge
