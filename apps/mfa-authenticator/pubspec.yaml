name: mfa_authenticator
description: IDaaS Authenticator - TOTP MFA App compatible with Google and Microsoft Authenticator

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # TOTP generation
  otp: ^3.1.4

  # QR code scanning
  qr_code_scanner: ^1.0.1

  # State management
  flutter_bloc: ^8.1.3

  # Secure storage for secrets
  flutter_secure_storage: ^9.0.0

  # UI components
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
