version: '3.8'

# Development-specific overrides
# NOTE: Also uses external DBaaS (can use dev/staging instance)

services:
  webapp:
    build:
      target: builder
    environment:
      FLASK_APP: app:create_app()
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      LOG_LEVEL: DEBUG
      REDIS_URL: ${DRAGONFLY_URL}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-for-testing-only}
    volumes:
      - ./apps/webapp:/app
      - /app/__pycache__
    command: ["flask", "run", "--host=0.0.0.0", "--port=8080", "--reload"]
    ports:
      - "5000:8080"

  keycloak:
    environment:
      KC_LOG_LEVEL: DEBUG
      KC_DB_URL: ${YUGABYTE_DB_URL}
      KC_DB_USERNAME: ${YUGABYTE_USER}
      KC_DB_PASSWORD: ${YUGABYTE_PASSWORD}

  oauth2-proxy:
    environment:
      OAUTH2_PROXY_REDIS_CONNECTION_URL: ${DRAGONFLY_SESSION_URL}
